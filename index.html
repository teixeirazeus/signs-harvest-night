<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signs: Harvest Night — 3D Horror FPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HUD overlay -->
  <div id="hud">
    <div id="crosshair">+</div>
    <div id="anomaly-counter">Anomalies: <span id="anomaly-count">0</span>/5</div>
    <div id="stare-meter-container">
      <div id="stare-label">STARE</div>
      <div id="stare-meter"></div>
    </div>
  </div>

  <!-- Game Over / Win screens -->
  <div id="game-over-screen" class="overlay-screen hidden">
    <div class="overlay-content">
      <h1 id="game-over-title">GAME OVER</h1>
      <p id="game-over-reason"></p>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <div id="win-screen" class="overlay-screen hidden">
    <div class="overlay-content">
      <h1>ANOMALIES CONTAINED</h1>
      <p>All 5 anomalies collected. The farm is safe... for now.</p>
      <button id="restart-btn-win">Play Again</button>
    </div>
  </div>

  <!-- Instructions overlay (shown before pointer lock) -->
  <div id="instructions">
    <div class="menu-vignette"></div>
    <div class="menu-scanlines"></div>
    <div class="menu-content">
      <div class="menu-subtitle">A Harvest Night</div>
      <h2 class="menu-title">
        <span class="title-line">SIGNS</span>
        <span class="title-divider">✦</span>
      </h2>
      <div class="menu-controls">
        <p><span class="key">W A S D</span> — Move</p>
        <p><span class="key">Mouse</span> — Look</p>
        <p><span class="key">R</span> — Restart</p>
      </div>
      <div class="menu-objective">
        <p>Find <span class="highlight">5 anomalies</span> in the cornfield</p>
        <p>Avoid the stalker. <span class="danger">Don't stare too long.</span></p>
      </div>
      <div class="menu-click-prompt">
        <span class="prompt-bracket">[</span>
        <span class="prompt-text">Click to begin</span>
        <span class="prompt-bracket">]</span>
      </div>
    </div>
  </div>

  <!-- Abduction white fade overlay -->
  <div id="abduction-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:white;z-index:90;pointer-events:none;opacity:0;"></div>

  <!-- Cornfield spritesheet — preloaded for sprite-based cornfield -->
  <img id="spritesheet" src="sprites/cornfield.png" style="display:none;" crossorigin="anonymous">

  <!-- Three.js import map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- Howler.js CDN for game audio -->
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>

  <script type="module" src="main.js"></script>
</body>
</html>
