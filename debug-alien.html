<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug: Grey Alien — Signs: Harvest Night</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    canvas { display: block; image-rendering: pixelated; }

    #info {
      position: fixed; bottom: 16px; left: 16px;
      color: #8f8; font-family: monospace; font-size: 12px;
      background: rgba(0,0,0,0.7); padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.1); z-index: 10;
      pointer-events: none;
    }

    #controls {
      position: fixed; bottom: 16px; right: 16px;
      color: #aaa; font-family: monospace; font-size: 11px;
      background: rgba(0,0,0,0.7); padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.1); z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">Grey Alien Debug View — Signs: Harvest Night</div>
  <div id="controls">
    🖱️ Drag = Rotate | Scroll = Zoom | Right-drag = Pan
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================================
    // PSX-style renderer (same as game)
    // ============================================================================
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(640, 480);
    renderer.setPixelRatio(1);
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.domElement.style.imageRendering = 'pixelated';
    document.body.appendChild(renderer.domElement);

    // ============================================================================
    // Scene + camera
    // ============================================================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(50, 640/480, 0.1, 50);
    camera.position.set(3, 2.5, 6);
    camera.lookAt(0, 2, 0);

    // OrbitControls for inspection
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.minDistance = 1.5;
    controls.maxDistance = 15;
    controls.update();

    // ============================================================================
    // Lighting
    // ============================================================================
    // Ambient — enough to see the whole model
    const ambient = new THREE.AmbientLight(0x444466, 1.2);
    scene.add(ambient);

    // Key light — from front-right, casts shadows
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(5, 8, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 512;
    keyLight.shadow.mapSize.height = 512;
    scene.add(keyLight);

    // Rim light — from behind, separates silhouette
    const rimLight = new THREE.DirectionalLight(0x4466aa, 1.5);
    rimLight.position.set(-3, 2, -4);
    scene.add(rimLight);

    // Fill light — soft from below to show under-chin details
    const fillLight = new THREE.DirectionalLight(0x336644, 0.8);
    fillLight.position.set(0, 0.5, 3);
    scene.add(fillLight);

    // ============================================================================
    // Ground reference grid
    // ============================================================================
    const grid = new THREE.GridHelper(6, 12, 0x335533, 0x222233);
    scene.add(grid);

    // Simple ground disc
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(3, 16),
      new THREE.MeshStandardMaterial({ color: 0x1a2a14, roughness: 0.9, flatShading: true })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ============================================================================
    // GREY ALIEN — same geometry as game main.js (post-proportion-fix)
    // ============================================================================
    const alien = new THREE.Group();

    const skinGreen = new THREE.MeshStandardMaterial({
      color: 0x3d7a2e, roughness: 0.7, metalness: 0.05, flatShading: true,
    });
    const limbGreen = new THREE.MeshStandardMaterial({
      color: 0x2a5a1e, roughness: 0.75, metalness: 0.05, flatShading: true,
    });
    const eyeBlack = new THREE.MeshStandardMaterial({
      color: 0x020202, roughness: 0.1, metalness: 0.0, flatShading: true,
    });

    // Head — bulbous ellipsoid, ~1.15u tall
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 8), skinGreen);
    head.scale.set(0.85, 1.15, 0.7);
    head.position.y = 3.25;
    head.castShadow = true;
    alien.add(head);

    // Eyes — almond-shaped black ovals
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), eyeBlack);
    eyeL.scale.set(1.4, 0.85, 0.3);
    eyeL.position.set(-0.25, 3.45, 0.28);
    alien.add(eyeL);

    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), eyeBlack);
    eyeR.scale.set(1.4, 0.85, 0.3);
    eyeR.position.set(0.25, 3.45, 0.28);
    alien.add(eyeR);

    // Eye glow lights (green)
    const glowL = new THREE.PointLight(0x44aa22, 1.5, 4, 2);
    glowL.position.copy(eyeL.position);
    alien.add(glowL);
    const glowR = new THREE.PointLight(0x44aa22, 1.5, 4, 2);
    glowR.position.copy(eyeR.position);
    alien.add(glowR);

    // Neck
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, 0.25, 6), limbGreen);
    neck.position.y = 2.55;
    alien.add(neck);

    // Body
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 1.05, 8), skinGreen);
    body.position.y = 1.85;
    body.castShadow = true;
    alien.add(body);

    // Arms
    const armGeom = new THREE.CylinderGeometry(0.06, 0.05, 1.3, 6);
    const armL = new THREE.Mesh(armGeom, limbGreen);
    armL.position.set(-0.36, 1.75, 0);
    armL.rotation.z = 0.25;
    armL.castShadow = true;
    alien.add(armL);
    const armR = new THREE.Mesh(armGeom, limbGreen);
    armR.position.set(0.36, 1.75, 0);
    armR.rotation.z = -0.25;
    armR.castShadow = true;
    alien.add(armR);

    // Legs
    const legGeom = new THREE.CylinderGeometry(0.08, 0.06, 1.1, 6);
    const legL = new THREE.Mesh(legGeom, limbGreen);
    legL.position.set(-0.16, 0.5, 0);
    legL.castShadow = true;
    alien.add(legL);
    const legR = new THREE.Mesh(legGeom, limbGreen);
    legR.position.set(0.16, 0.5, 0);
    legR.castShadow = true;
    alien.add(legR);

    alien.position.set(0, 0.02, 0);
    // Scale to match game: ~1.4u total height (Grey classic proportion)
    alien.scale.set(0.35, 0.35, 0.35);
    scene.add(alien);

    // ============================================================================
    // Height markers (rulers)
    // ============================================================================
    function addMarker(y, label, color) {
      const marker = new THREE.Mesh(
        new THREE.SphereGeometry(0.04, 4, 4),
        new THREE.MeshBasicMaterial({ color })
      );
      marker.position.set(1.2, y, 0);
      scene.add(marker);
      // Wire line
      const lineGeom = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(1.0, y, 0),
        new THREE.Vector3(0.85, y, 0),
      ]);
      const line = new THREE.Line(lineGeom, new THREE.LineBasicMaterial({ color }));
      scene.add(line);
      console.log(`${label}: y=${y.toFixed(2)}`);
    }

    addMarker(1.15, 'head top (~4.4u)', 0xff4444);
    addMarker(2.1,  'head bottom', 0xff8844);
    addMarker(1.85, 'body center', 0x44ff44);
    addMarker(0,    'ground', 0x4444ff);

    console.log('=== Grey Alien Debug View ===');
    console.log('Total height: ~4.4 units');
    console.log('Head: 0.5 radius × 1.15 Y scale = ~1.15u tall (~26% of body)');
    console.log('Eyes: 0.22 radius × 1.4 X scale = 0.62u wide');

    // ============================================================================
    // Animation loop
    // ============================================================================
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize handler
    window.addEventListener('resize', () => {
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
    });
  </script>
</body>
</html>
